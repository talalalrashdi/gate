<!doctype html><html><head><meta charset="UTF-8"><title>Clerio layout review</title><style>body{margin:0;background:#edf1f4;font:14px Arial}header{height:48px;display:flex;gap:12px;align-items:center;padding:0 16px}select{padding:6px}#stage{position:relative;margin:auto}iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left;background:white}</style></head><body><header><label for="size">Viewport</label><select id="size"><option value="2048,1026">Wide · 2048 × 1026</option><option value="1440,900">Desktop · 1440 × 900</option><option value="768,1024">Tablet · 768 × 1024</option><option value="390,844">Phone · 390 × 844</option></select></header><div id="stage"><iframe title="Dashboard preview" src="/"></iframe></div><script>const select=document.querySelector('select'),frame=document.querySelector('iframe'),stage=document.querySelector('#stage');function resize(){const [w,h]=select.value.split(',').map(Number),scale=Math.min(1,(innerWidth-24)/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';stage.style.width=w*scale+'px';stage.style.height=h*scale+'px'}select.addEventListener('change',resize);window.addEventListener('resize',resize);resize();</script></body></html>
